<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>stankquilizer — observatory</title>
<style>
:root{--bg:#090909;--p:#101010;--l:#262626;--t:#e8e8e8;--m:#777;--g:#8fc39a;--b:rgba(255,255,255,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:radial-gradient(#fff .5px,transparent .5px);background-size:5px 5px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);border:1px solid var(--l);padding:30px;background:#0c0c0c;box-shadow:0 0 70px var(--b)}.k{font-size:10px;letter-spacing:.2em;color:#555}.box h1{font-size:21px;font-weight:400;margin:13px 0 7px}.box p{color:#777;line-height:1.7;font-size:11px}.field{display:flex;gap:8px;margin-top:24px}input{flex:1;background:#080808;border:1px solid var(--l);padding:13px;color:#eee;outline:0}.btn{background:#151515;border:1px solid #333;color:#eee;padding:12px 15px;font:10px ui-monospace}.err{height:18px;color:#c77b7b;font-size:10px;margin-top:9px}.note{margin-top:24px;border-top:1px solid #1b1b1b;padding-top:18px;color:#555;font-size:9px;line-height:1.6}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}aside{border-right:1px solid var(--l);padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:3px 9px 24px}.brand strong{font-weight:400}.brand span{display:block;color:#555;font-size:9px;margin-top:6px}nav button{display:block;width:100%;text-align:left;background:0;border:0;color:#777;padding:10px 9px;font:10px ui-monospace;cursor:pointer}nav button.active,nav button:hover{color:#eee;background:#111}.side{position:absolute;bottom:18px;left:23px;color:#444;font-size:9px;line-height:1.7}main{padding:26px 28px 50px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:25px}.top h2{font-weight:400;font-size:18px;margin:0 0 7px}.top p{margin:0;color:#555;font-size:10px}.status{font-size:9px;color:var(--g);border:1px solid #27372b;padding:7px 9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--l);background:linear-gradient(145deg,#111,#0c0c0c);padding:16px}.metric .lab{font-size:9px;color:#666;text-transform:uppercase}.metric .val{font-size:25px;margin:12px 0 4px}.metric .sub{font-size:9px;color:#555}.section{margin-top:22px}.st{font-size:10px;color:#777;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.list{border:1px solid var(--l)}.row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:11px 13px;border-bottom:1px solid #1b1b1b;font-size:10px}.row:last-child{border:0}.time,.meta{color:#555}.meta{text-align:right}.bars{display:flex;align-items:end;gap:4px;height:110px}.bar{flex:1;background:#333;min-width:3px}.table{border:1px solid var(--l);overflow:auto}table{width:100%;border-collapse:collapse;font-size:9px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #1b1b1b;white-space:nowrap}th{color:#555;font-weight:400}td{color:#aaa}.controls{display:flex;flex-wrap:wrap;gap:6px}.controls input{min-width:120px}.mobilebar{display:none}.more{display:none}@media(max-width:900px){.app{display:block}aside{display:none}.mobilebar{display:flex;position:fixed;z-index:50;left:0;right:0;bottom:0;background:#0b0b0b;border-top:1px solid #262626;padding:7px 5px env(safe-area-inset-bottom);gap:3px}.mobilebar button{flex:1;background:none;border:0;color:#666;font:7px ui-monospace;padding:8px 2px}.mobilebar button.active{color:#eee}main{padding:20px 14px 78px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.row{grid-template-columns:65px minmax(0,1fr) auto}.row .meta{display:none}}@media(max-width:560px){.grid{gap:7px}.card{padding:12px}.top{display:block}.status{display:inline-block;margin-top:12px}.controls input{width:100%}}@media(max-width:340px){main{padding-left:8px;padding-right:8px}.metric .val{font-size:18px}}
</style></head>
<body>
<div id="login" class="login"><div class="box"><div class="k">PRIVATE SYSTEM / ACCESS REQUIRED</div><h1>stankquilizer — observatory</h1><p>the public site remembers visitors.<br>this place watches the machinery.</p><div class="field"><input id="pw" type="password" placeholder="access phrase" autocomplete="off"><button class="btn" id="go">enter</button></div><div id="err" class="err"></div><div class="note">PRIVATE BUILD · server-side authentication · anonymous telemetry only.</div></div></div>
<div id="app" class="app hidden"><aside><div class="brand"><strong>stankquilizer</strong><span>observatory</span></div><nav id="nav"></nav><div class="side">PRIVATE · NO IP / NO LOCATION<br>D1-BACKED</div></aside><main id="main"></main></div>
<div id="mobilebar" class="mobilebar"></div>
<script>
const pages=["overview","sessions","memory","radio","projects","features","events","journey","qa","deployments","privacy","system"];
const tracks=["i get high","i feel like you’re the only one","in the sunken place","zzz","the seraphim","fake gifted","stankquilizer type beat","unimagineable probability","ignantamus","the chops","life of the loop","the earth i scar"];
const features=["Behavioral memory","Listener profile","Track & album affinity","Avoidance memory","Memory decay","Adaptive radio","Anti-personalization","Rediscovery","Session archetypes","Session temperature","Adaptive atmosphere","Memory-driven UI","Site state","Relationship age","Memory ghosts","Session milestones","Progressive unlocking","Discovery ledger","Memory corruption","Completion state","res(e)t"];
const $=id=>document.getElementById(id); const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const nav=$('nav'); pages.forEach(p=>{const b=document.createElement('button');b.dataset.page=p;b.textContent=p;b.onclick=()=>render(p);nav.appendChild(b)});
const mobile=$('mobilebar'); pages.slice(0,5).forEach(p=>{const b=document.createElement('button');b.dataset.page=p;b.textContent=p;b.onclick=()=>render(p);mobile.appendChild(b)}); const more=document.createElement('button');more.textContent='more';more.onclick=()=>{pages.slice(5).forEach(p=>{const b=document.createElement('button');b.dataset.page=p;b.textContent=p;b.onclick=()=>{render(p);document.querySelectorAll('#mobilebar button').forEach(x=>x.classList.remove('active'))};mobile.appendChild(b)});};
function metric(a,b,c){return `<div class="card metric"><div class="lab">${esc(a)}</div><div class="val">${esc(b)}</div><div class="sub">${esc(c)}</div></div>`}
function head(a,b){return `<div class="top"><div><h2>${esc(a)}</h2><p>${esc(b)}</p></div><div class="status">● ingestion nominal</div></div>`}
function bars(){return `<div class="bars">${Array.from({length:38},(_,i)=>`<i class="bar" style="height:${18+(i*37)%72}%"></i>`).join('')}</div>`}
function rows(list){return `<div class="list">${list.map(e=>`<div class="row"><span class="time">${esc(e[0])}</span><span>${esc(e[1])} <span class="time">· ${esc(e[2])}</span></span><span class="meta">${esc(e[3])}</span></div>`).join('')}</div>`}
const demoEvents=[['00:01:04','track_meaningful_play','07 · stankquilizer type beat','radio'],['00:02:31','site_state_change','CALM → ACTIVE','system'],['00:04:09','album_entered','project two','projects'],['00:05:47','track_skipped','03 · in the sunken place','radio'],['00:06:10','rediscovery','11 · life of the loop','memory']];
async function api(path,options={}){try{const r=await fetch('/api'+path,{credentials:'same-origin',...options});if(r.status===401){location.reload();return null}if(!r.ok)return null;return await r.json()}catch{return null}}
function overview(data={}){return head('overview','the whole system, without the mystery layer.')+`<div class="grid">${metric('active sessions',data.sessions??'—','last 24h')}${metric('meaningful plays',data.meaningfulPlays??'—','last 24h')}${metric('completions',data.completions??'—','last 24h')}${metric('skips',data.skips??'—','last 24h')}${metric('events',data.events??'—','last 24h')}${metric('rediscoveries',data.rediscoveries??'—','last 24h')}${metric('tracks','12','radio foundation')}${metric('features','21','feature matrix')}</div><div class="two section"><div><div class="st">event transmission</div><div class="card">${bars()}</div></div><div><div class="st">current site state</div><div class="card"><div style="font-size:30px">ACTIVE</div><div style="color:#666;font-size:9px;line-height:1.8;margin-top:8px">temperature +3<br>dominant archetype / explorer<br>adaptive radio / enabled</div></div></div></div><div class="section"><div class="st">sample transmission</div>${rows(demoEvents)}</div>`}
function simple(name,subtitle,text){return head(name,subtitle)+`<div class="card" style="line-height:2;color:#777">${text}</div>`}
async function sessions(){const d=await api('/sessions?limit=20')||[];return head('sessions','anonymous sessions; no IP or location.')+`<div class="table"><table><tr><th>session</th><th>started</th><th>last seen</th><th>events</th><th>build</th></tr>${d.map(x=>`<tr><td>${esc(String(x.id).slice(0,12))}</td><td>${new Date(x.started_at).toLocaleString()}</td><td>${new Date(x.last_seen).toLocaleString()}</td><td>${esc(x.event_count)}</td><td>${esc(x.build||'')}</td></tr>`).join('')||'<tr><td colspan="5">no sessions yet</td></tr>'}</table></div>`}
async function eventsPage(){const d=await api('/events?limit=100')||[];return head('events','raw telemetry stream, bounded to allowlisted event fields.')+`<div class="table"><table><tr><th>time</th><th>type</th><th>surface</th><th>subject</th><th>session</th></tr>${d.map(x=>`<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${esc(x.type)}</td><td>${esc(x.surface)}</td><td>${esc(x.subject)}</td><td>${esc(String(x.session_id).slice(0,10))}</td></tr>`).join('')||'<tr><td colspan="5">no events yet</td></tr>'}</table></div>`}
function featuresPage(){return head('feature matrix','the complete observatory feature map.')+`<div class="grid">${features.map((f,i)=>metric(String(i+1).padStart(2,'0')+' · '+f,i===20?'READY':'ACTIVE',(i*37)%900+' observed')).join('')}</div>`}
function radio(){return head('radio laboratory','adaptive transmission and the 12-track foundation.')+`<div class="grid">${metric('adaptive picks','—','live telemetry')}${metric('skip rate','—','live telemetry')}${metric('no-repeat success','—','live telemetry')}${metric('track starts','—','live telemetry')}</div><div class="section"><div class="table"><table><tr><th>track</th><th>index</th><th>affinity</th></tr>${tracks.map((t,i)=>`<tr><td>${String(i+1).padStart(2,'0')} · ${esc(t)}</td><td>${i+1}</td><td>${(0.82-i*.035).toFixed(2)}</td></tr>`).join('')}</table></div></div>`}
function memory(){return head('memory laboratory','aggregate behavior memory; raw visitor memory remains local.')+`<div class="grid">${metric('profiles','—','D1 aggregate')}${metric('returning','—','D1 aggregate')}${metric('affinity shifts','—','D1 aggregate')}${metric('decay events','—','D1 aggregate')}${metric('rediscoveries','—','D1 aggregate')}${metric('avoidance changes','—','D1 aggregate')}${metric('memory ghosts','—','presentation')}${metric('relationships','—','aggregate')}</div><div class="two section"><div><div class="st">memory pressure</div><div class="card">${bars()}</div></div><div><div class="st">privacy boundary</div><div class="card">raw visitor memory remains local to the public experience.<br><br>observatory receives bounded anonymous events only.</div></div></div>`}
async function deployments(){const d=await api('/deployments')||[];return head('deployment diff','record public / observatory releases for behavior correlation.')+`<div class="card"><div class="controls"><input id="dbuild" placeholder="build"><input id="dref" placeholder="git ref"><input id="dnote" placeholder="note"><button class="btn" id="record">record</button></div></div><div class="section"><div class="table"><table><tr><th>time</th><th>build</th><th>ref</th><th>note</th></tr>${d.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.build)}</td><td>${esc(x.ref)}</td><td>${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="4">no deployments recorded</td></tr>'}</table></div></div>`}
function qa(){return head('qa / test console','synthetic probes are explicitly marked and never modify a real visitor profile.')+`<div class="card"><div class="controls">${['first visit','returning visitor','soft res(e)t','full res(e)t','completion','memory ghost','radio transition','mobile layout'].map(x=>`<button class="btn qa" data-scenario="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`}
function privacy(){return head('privacy monitor','what the observatory can and cannot know.')+`<div class="grid">${metric('IP address','NEVER','not collected')}${metric('location','NEVER','not collected')}${metric('names','NEVER','not collected')}${metric('raw memory','NEVER','local only')}${metric('full URL','NEVER','not stored')}${metric('user agent','NEVER','not stored')}${metric('session ID','YES','pseudonymous')}${metric('event metadata','BOUNDED','allowlisted')}</div>`}
function system(){return head('system','deployment, ingestion, database and runtime health.')+`<div class="two"><div><div class="st">architecture</div><div class="card" style="line-height:2">PUBLIC SITE<br>↓<br>ANONYMOUS EVENTS<br>↓<br>TELEMETRY WORKER<br>↓<br>D1<br>↓<br>OBSERVATORY</div></div><div><div class="st">security</div><div class="card" style="line-height:2">WORKER-SIDE PASSWORD<br>HTTPONLY COOKIE<br>SECURE / SAMESITE<br>NO PUBLIC DB ACCESS</div></div></div>`}
async function render(page){location.hash=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html;if(page==='overview')html=overview(await api('/overview')||{});else if(page==='sessions')html=await sessions();else if(page==='events')html=await eventsPage();else if(page==='memory')html=memory();else if(page==='radio')html=radio();else if(page==='features')html=featuresPage();else if(page==='deployments')html=await deployments();else if(page==='qa')html=qa();else if(page==='privacy')html=privacy();else if(page==='system')html=system();else if(page==='projects')html=simple('projects','album and project telemetry.','project-level views will populate from future album events.');else if(page==='journey')html=simple('visitor journeys','anonymous movement through the experience, not identity.','radio → album → rediscovery → completion is represented only through aggregate event relationships.');$('main').innerHTML=html;if(page==='qa')document.querySelectorAll('.qa').forEach(b=>b.onclick=async()=>{const r=await api('/qa',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:b.dataset.scenario})});b.textContent=r?'emitted':'failed'});if(page==='deployments')$('record').onclick=async()=>{await api('/deployments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({build:$('dbuild').value,ref:$('dref').value,note:$('dnote').value})});render('deployments')};}
async function boot(){const r=await fetch('/api/auth-status');if(r.ok){const s=await r.json();if(s.worker==='RUNNING'){} }const first=await api('/health');if(first){$('login').classList.add('hidden');$('app').classList.remove('hidden');render(location.hash.slice(1)||'overview')}}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('err').textContent='';$('login').classList.add('hidden');$('app').classList.remove('hidden');render('overview')}else $('err').textContent='access denied'}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};boot();
</script></body></html>
