<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>stankquilizer — observatory</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#101010;--line:#242424;--muted:#777;--text:#e8e8e8;--soft:#aaa}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px}
button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login-box{width:min(440px,100%);border:1px solid var(--line);background:#0d0d0d;padding:28px}
.kicker,.label,.eyebrow{font-size:9px;letter-spacing:.08em;color:#666;text-transform:uppercase}
h1{font-size:22px;font-weight:500;margin:12px 0}
.login p{color:#888;line-height:1.8;margin:0 0 22px}
.field{display:flex;gap:8px}
input{min-width:0;flex:1;background:#090909;color:#eee;border:1px solid #303030;padding:11px 12px;outline:0}
input:focus{border-color:#666}
.btn{border:1px solid #363636;background:#151515;color:#ddd;padding:10px 13px}
.btn:hover{border-color:#777;color:#fff}
.error{min-height:18px;color:#b88;font-size:10px;margin-top:10px}
.note{color:#555;font-size:9px;line-height:1.7;margin-top:18px}
.app{min-height:100dvh;display:grid;grid-template-columns:190px 1fr}
aside{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh}
.brand{padding:4px 7px 22px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand strong{display:block;font-size:13px;font-weight:500}.brand span{display:block;color:#555;font-size:8px;margin-top:5px}
nav{display:grid;gap:2px}
nav button,.mobilebar button,.more-nav button{background:transparent;border:0;color:#666;text-align:left;padding:9px 7px;font-size:9px}
nav button:hover,nav button.active,.mobilebar button.active,.more-nav button:hover{color:#eee;background:#151515}
.side{position:absolute;bottom:18px;left:19px;right:12px;color:#444;font-size:8px;line-height:1.8}
main{padding:28px;max-width:1400px;width:100%}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
.top h2{font-size:19px;font-weight:500;margin:0 0 7px}.top p{margin:0;color:#666;font-size:10px;line-height:1.6}.status{font-size:8px;color:#777;white-space:nowrap;padding-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.card{background:var(--panel);border:1px solid var(--line);padding:15px}
.metric .label{margin-bottom:11px}.metric .value{font-size:23px;line-height:1.1;margin-bottom:7px}.metric .sub{color:#666;font-size:9px}
.section{margin-top:18px}.section-title{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.table-wrap{overflow:auto;border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 11px;border-bottom:1px solid #1d1d1d;text-align:left;font-size:9px;white-space:nowrap}th{color:#666;font-weight:400;text-transform:uppercase;font-size:8px}
.rows{display:grid}.row{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;padding:11px;border-bottom:1px solid #1c1c1c;font-size:9px}.row:last-child{border-bottom:0}.muted{color:#666}.ok{color:#aaa}
.bars{height:120px;display:flex;align-items:end;gap:3px}.bar{flex:1;background:#777;min-width:2px;display:block}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.feature{border:1px solid var(--line);background:var(--panel);padding:12px}.feature-head{display:flex;justify-content:space-between;gap:8px}.feature-name{font-size:9px}.count{color:#666;font-size:8px}.state{font-size:8px;color:#666;margin-top:7px}.trace{height:2px;background:#242424;margin-top:9px}.trace i{display:block;height:100%;background:#777}
.controls{display:flex;flex-wrap:wrap;gap:7px}.controls input{flex:1 1 160px}
pre{white-space:pre-wrap;word-break:break-word;color:#777;line-height:1.7;font-size:9px;margin:0}
.mobilebar{display:none}.more-sheet{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#151515;border:1px solid #333;padding:9px 12px;color:#ddd;font-size:9px;z-index:20}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:none}main{padding:20px 15px 82px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;background:#0c0c0c;border-top:1px solid var(--line);padding:6px 5px env(safe-area-inset-bottom);gap:2px}.mobilebar button{flex:1;text-align:center;padding:9px 3px;font-size:8px}.more-sheet{position:fixed;inset:0;background:#000b;z-index:15;align-items:flex-end}.more-sheet.open{display:flex}.more-inner{background:#101010;border-top:1px solid #333;width:100%;max-height:75dvh;overflow:auto;padding:12px}.more-head{display:flex;justify-content:space-between;color:#666;padding:5px 3px 10px}.more-nav{display:grid}.more-nav button{width:100%;border-bottom:1px solid #1c1c1c}.two{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.top{display:block}.status{margin-top:10px}}
@media(max-width:420px){main{padding-left:10px;padding-right:10px}.grid{gap:6px}.card{padding:12px}.metric .value{font-size:19px}.login-box{padding:22px}.field{display:grid;grid-template-columns:1fr}.field .btn{width:100%}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-box">
    <div class="kicker">private system / access required</div>
    <h1>stankquilizer — observatory</h1>
    <p>the public site remembers visitors.<br>this place watches the machinery.</p>
    <form id="loginForm" class="field">
      <input id="password" type="password" placeholder="access phrase" autocomplete="current-password">
      <button class="btn" type="submit">enter</button>
    </form>
    <div id="loginError" class="error" aria-live="polite"></div>
    <div class="note">PRIVATE BUILD · server-side authentication · anonymous telemetry only.</div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside>
    <div class="brand"><strong>stankquilizer</strong><span>observatory</span></div>
    <nav id="desktopNav"></nav>
    <div class="side">PRIVATE · NO IP / NO LOCATION<br>SERVER-SIDE AUTH · D1</div>
  </aside>
  <main id="main"></main>
</section>

<div id="mobilebar" class="mobilebar"></div>
<div id="moreSheet" class="more-sheet">
  <div class="more-inner">
    <div class="more-head"><span>more systems</span><button id="closeMore" class="btn">close</button></div>
    <div id="moreNav" class="more-nav"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  'use strict';

  const NAV = ['overview','live','sessions','memory','player','radio','projects','rediscovery','journey','features','qa','events','deploy','privacy','system'];
  const TRACKS = [
    'i get high',"i feel like you're the only one",'in the sunken place','zzz...',
    'the seraphim','fake gifted','stankquilizer type beat','unimagineable probability',
    'ignantamus','the chops','life of the loop','the earth i scar'
  ];
  const FEATURES = [
    'Behavioral memory','Listener profile','Track & album affinity','Avoidance memory',
    'Memory decay','Adaptive radio','Anti-personalization','Rediscovery','Session archetypes',
    'Session temperature','Adaptive atmosphere','Memory-driven UI','Site state','Relationship age',
    'Memory ghosts','Session milestones','Progressive unlocking','Discovery ledger',
    'Memory corruption','Completion state','res(e)t'
  ];

  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );

  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.remove('hidden');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add('hidden'), 1800);
  }

  async function api(path, options = {}) {
    const response = await fetch('/api' + path, {
      credentials: 'same-origin',
      cache: 'no-store',
      ...options,
      headers: {'content-type':'application/json', ...(options.headers || {})}
    });
    if (response.status === 401) {
      throw new Error('AUTH_REQUIRED');
    }
    if (!response.ok) throw new Error('HTTP_' + response.status);
    const type = response.headers.get('content-type') || '';
    return type.includes('application/json') ? response.json() : null;
  }

  function metric(label, value, sub) {
    return `<div class="card metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`;
  }
  function head(title, subtitle) {
    return `<div class="top"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><div class="status" id="refreshStatus" aria-live="polite">● auto-refresh every 15s · loading</div></div>`;
  }
  function bars(rows=[]) {
    const counts = new Map((rows || []).map(row=>[Number(row.hour),Number(row.count)||0]));
    const maximum = Math.max(1,...counts.values());
    return `<div class="bars" role="img" aria-label="Event counts per UTC hour over the last 24 hours">${Array.from({length:24},(_,hour)=>{const count=counts.get(hour)||0;const height=count?Math.max(3,Math.round(count/maximum*100)):2;return `<i class="bar" title="${String(hour).padStart(2,'0')}:00 UTC · ${count} events" style="height:${height}%"></i>`}).join('')}</div>`;
  }

  function overview(data) {
    const d = data || {};
    return head('overview','the whole system, without the mystery layer.') +
      `<div class="grid">
        ${metric('sessions / 24h',d.sessions ?? '—','D1')}
        ${metric('meaningful plays',d.meaningfulPlays ?? '—','D1')}
        ${metric('completions',d.completions ?? '—','D1')}
        ${metric('skips',d.skips ?? '—','D1')}
        ${metric('events / 24h',d.events ?? '—','D1')}
        ${metric('rediscoveries',d.rediscoveries ?? '—','D1')}
        ${metric('radio sessions',d.radioSessions ?? '—','D1')}
        ${metric('auth','ONLINE','server-side')}
      </div>
      <div class="two section">
        <div><div class="section-title">event transmission · hourly</div><div class="card">${bars(d.eventsByHour)}</div></div>
        <div><div class="section-title">architecture</div><div class="card"><pre>PUBLIC SITE
↓
ANONYMOUS EVENTS
↓
TELEMETRY WORKER
↓
D1 / EVENT STORE
↓
OBSERVATORY</pre></div></div>
      </div>`;
  }

  function eventTable(rows, emptyText = 'no events yet') {
    return `<div class="table-wrap"><table><thead><tr><th>time</th><th>session</th><th>event</th><th>subject</th><th>surface</th></tr></thead><tbody>${
      (rows || []).length ? rows.map(e=>`<tr><td>${new Date(e.ts).toLocaleString()}</td><td>${esc(e.session_id)}</td><td>${esc(e.type)}</td><td>${esc(e.subject)}</td><td>${esc(e.surface)}</td></tr>`).join('') :
      `<tr><td colspan="5">${esc(emptyText)}</td></tr>`
    }</tbody></table></div>`;
  }

  function live(data) {
    const rows = data?.events || [];
    const newest = rows.length ? new Date(rows[0].ts).toLocaleTimeString() : 'no recent events';
    return head('live transmission','recent events received by the collector and stored in D1.') +
      `<div class="grid">${metric('events in window',rows.length,'last 60 minutes')}${metric('newest event',newest,'local display time')}${metric('collector',data ? 'CONNECTED' : 'UNAVAILABLE','authenticated query')}${metric('privacy','BOUNDED','allowlisted data')}</div>
      <div class="section"><div class="section-title">live event stream · refreshes every 15 seconds</div>${eventTable(rows,'no events in the selected window')}</div>
      <div class="section"><div class="section-title">runtime contract</div><div class="card"><pre>no IP addresses · no location · no names
no raw visitor memory · random pseudonymous IDs
only allowlisted events and bounded metadata</pre></div></div>`;
  }

  async function sessions() {
    let rows = [];
    try { rows = await api('/sessions?limit=50'); } catch (e) {}
    return head('sessions','anonymous session records stored in D1.') +
      `<div class="table-wrap"><table><thead><tr><th>session</th><th>visitor key</th><th>started</th><th>last seen</th><th>build</th><th>events</th></tr></thead><tbody>${
        rows.length ? rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.visitor_key)}</td><td>${new Date(r.started_at).toLocaleString()}</td><td>${new Date(r.last_seen).toLocaleString()}</td><td>${esc(r.build)}</td><td>${esc(r.event_count)}</td></tr>`).join('') :
        '<tr><td colspan="6">no session records yet</td></tr>'
      }</tbody></table></div>`;
  }

  function countType(rows, type) {
    return Number((rows || []).find(row => row.type === type)?.count || 0);
  }

  function memory(data) {
    const counts = data?.counts || [];
    const rows = data?.recent || [];
    return head('memory laboratory','aggregate behavior memory; raw visitor memory remains local.') +
      `<div class="grid">${metric('snapshots',countType(counts,'memory_snapshot'),'30 days')}${metric('site-state changes',countType(counts,'site_state'),'30 days')}${metric('affinity shifts',countType(counts,'affinity_change'),'30 days')}${metric('decay events',countType(counts,'decay'),'30 days')}${metric('rediscoveries',countType(counts,'rediscovery'),'30 days')}${metric('avoidance changes',countType(counts,'avoidance_change'),'30 days')}${metric('memory ghosts',countType(counts,'memory_ghost'),'30 days')}${metric('resets / rebirths',countType(counts,'reset_action')+countType(counts,'rebirth'),'30 days')}</div>
      <div class="section"><div class="section-title">recent memory and journey events</div>${eventTable(rows,'no memory events yet')}</div>
      <div class="section"><div class="section-title">privacy boundary</div><div class="card"><pre>OBSERVATORY: event counts and bounded state summaries
PUBLIC SITE: visitor-facing memory profile
RAW TRACK / ALBUM MEMORY: never uploaded</pre></div></div>`;
  }

  function player(data) {
    const tracks = new Map((data?.tracks || []).map(track => [track.subject, track]));
    const total = type => Number((data?.totals || []).find(row => row.type === type)?.count || 0);
    return head('player laboratory','track identity and playback telemetry.') +
      `<div class="grid">${metric('tracks','12','album foundation')}${metric('track starts',total('track_started'),'D1')}${metric('meaningful plays',total('meaningful_play'),'D1')}${metric('completions',total('track_completed'),'D1')}</div>
      <div class="section"><div class="section-title">track identity</div><div class="table-wrap"><table><thead><tr><th>#</th><th>track</th><th>meaningful</th><th>complete</th><th>skip</th></tr></thead><tbody>${
        TRACKS.map((t,i)=>{const r=tracks.get(t)||{};return `<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(t)}</td><td>${esc(r.meaningful||0)}</td><td>${esc(r.completions||0)}</td><td>${esc(r.skips||0)}</td></tr>`}).join('')
      }</tbody></table></div></div>`;
  }

  function radio(data) {
    const totals = type => Number((data?.totals || []).find(row => row.type === type)?.count || 0);
    const starts = totals('track_started');
    const skips = totals('track_skipped');
    const skipRate = starts ? Math.round((skips / starts) * 100) + '%' : '0%';
    return head('radio laboratory','adaptive transmission and the 12-track foundation.') +
      `<div class="grid">${metric('radio sessions',totals('radio_play'),'D1')}${metric('skip rate',skipRate,'skips / starts')}${metric('meaningful plays',totals('meaningful_play'),'D1')}${metric('track starts',starts,'D1')}</div>
      <div class="section"><div class="section-title">track pressure</div><div class="table-wrap"><table><thead><tr><th>track</th><th>meaningful</th><th>complete</th><th>skip</th><th>progress events</th></tr></thead><tbody>${
        TRACKS.map((t,i)=>{const r=(data?.tracks||[]).find(track=>track.subject===t)||{};return `<tr><td>${String(i+1).padStart(2,'0')} · ${esc(t)}</td><td>${esc(r.meaningful||0)}</td><td>${esc(r.completions||0)}</td><td>${esc(r.skips||0)}</td><td>${esc(r.progressEvents||0)} progress events</td></tr>`}).join('')
      }</tbody></table></div></div>`;
  }

  function projects(data) {
    const albums = data?.albums || [];
    return head('projects','album/project-level telemetry surface.') +
      `<div class="grid">${metric('projects',albums.length,'seen releases')}${metric('album visits',albums.reduce((sum,row)=>sum+Number(row.visits||0),0),'D1')}${metric('release clicks',albums.reduce((sum,row)=>sum+Number(row.releases||0),0),'D1')}${metric('tracked releases',albums.filter(row=>Number(row.releases||0)>0).length,'D1')}</div>
      <div class="section"><div class="section-title">release activity · 30 days</div><div class="table-wrap"><table><thead><tr><th>album / release</th><th>album visits</th><th>release clicks</th></tr></thead><tbody>${
        albums.length ? albums.map(row=>`<tr><td>${esc(row.subject)}</td><td>${esc(row.visits)}</td><td>${esc(row.releases)}</td></tr>`).join('') : '<tr><td colspan="3">no release activity yet</td></tr>'
      }</tbody></table></div></div>`;
  }

  function journey(data) {
    const counts = data?.counts || [];
    const rows = (data?.recent || []).filter(row=>['milestone','unlock','completion','rediscovery','rebirth','reset_action'].includes(row.type));
    return head('journey','relationship progression and discovery ledger.') +
      `<div class="grid">${metric('milestones',countType(counts,'milestone'),'30 days')}${metric('unlocks',countType(counts,'unlock'),'30 days')}${metric('rediscoveries',countType(counts,'rediscovery'),'30 days')}${metric('completions',countType(counts,'completion'),'30 days')}</div>
      <div class="section"><div class="section-title">recent journey events</div>${eventTable(rows,'no journey events yet')}</div>`;
  }

  function rediscoveries(data) {
    const tracks = data?.tracks || [];
    const rows = data?.recent || [];
    return head('rediscovery ledger','tracks encountered again after a long absence; no raw listener profile is exposed.') +
      `<div class="grid">${metric('rediscovery events',data?.total || 0,`${data?.days || 30} days`)}${metric('tracks rediscovered',tracks.length,'top 100 tracks')}${metric('most returned',tracks[0]?.subject || '—','track')}${metric('days covered',data?.days || 30,'maximum 90')}</div>
      <div class="section"><div class="section-title">tracks with rediscovery events</div><div class="table-wrap"><table><thead><tr><th>track</th><th>rediscoveries</th><th>most recent</th></tr></thead><tbody>${
        tracks.length ? tracks.map(row=>`<tr><td>${esc(row.subject)}</td><td>${esc(row.count)}</td><td>${new Date(row.last_seen).toLocaleString()}</td></tr>`).join('') : '<tr><td colspan="3">no rediscoveries yet</td></tr>'
      }</tbody></table></div></div>
      <div class="section"><div class="section-title">recent events</div>${eventTable(rows,'no rediscovery events yet')}</div>`;
  }

  function features(data) {
    const counts = new Map();
    for (const row of data?.counts || []) counts.set(row.type,(counts.get(row.type)||0)+(Number(row.count)||0));
    return head('feature matrix','the 21-feature Category 5 system plus the observatory foundation.') +
      `<div class="feature-grid">${
        FEATURES.map((f,i)=>{const eventType=['memory_snapshot','site_state','affinity_change','avoidance_change','decay','radio_play','track_started','track_skipped','rediscovery','session_evolution','temperature_change','site_state','site_state','site_state','memory_ghost','milestone','unlock','milestone','memory_corruption','completion','reset_action'][i];const count=counts.get(eventType)||0;const width=Math.min(100,Math.max(4,count?20+Math.log2(count+1)*12:4));return `<div class="feature"><div class="feature-head"><span class="feature-name">${String(i+1).padStart(2,'0')} · ${esc(f)}</span><span class="count">${count}</span></div><div class="state">${esc(eventType)} · 30 days</div><div class="trace"><i style="width:${width}%"></i></div></div>`}).join('')
      }</div>`;
  }

  function qa(recent = []) {
    return head('QA laboratory','synthetic records are explicitly marked and do not represent real visitors.') +
      `<div class="card"><div class="controls">${
        ['session_start','track_started','meaningful_play','track_completed','track_skipped','album_entered','rediscovery','milestone','unlock','completion','soft-reset','full-reset','rebirth'].map(s=>`<button class="btn" data-qa="${esc(s)}">${esc(s)}</button>`).join('')
      }</div></div>
      <div class="section"><div class="section-title">recent synthetic probes</div><div class="table-wrap"><table><thead><tr><th>time</th><th>scenario</th><th>synthetic</th><th>session</th></tr></thead><tbody>${
        recent.length ? recent.map(row=>{let meta={};try{meta=JSON.parse(row.meta_json||'{}')}catch(_){}return `<tr><td>${new Date(row.ts).toLocaleString()}</td><td>${esc(row.subject)}</td><td>${meta.synthetic?'yes':'—'}</td><td>${esc(row.session_id)}</td></tr>`}).join('') : '<tr><td colspan="4">no QA probes yet</td></tr>'
      }</tbody></table></div></div>
      <div class="section"><div class="section-title">test contract</div><div class="card"><pre>QA probes use isolated random session IDs.
Synthetic metadata is stored in meta_json.
No IP, location, names, or raw memory are created.</pre></div></div>`;
  }

  function events(rows) {
    return head('events','raw anonymous telemetry stream.') +
      `<div class="table-wrap"><table><thead><tr><th>time</th><th>session</th><th>event</th><th>subject</th><th>surface</th></tr></thead><tbody>${
        (rows || []).length ? rows.map(e=>`<tr><td>${new Date(e.ts).toLocaleString()}</td><td>${esc(e.session_id)}</td><td>${esc(e.type)}</td><td>${esc(e.subject)}</td><td>${esc(e.surface)}</td></tr>`).join('') :
        '<tr><td colspan="5">no events yet</td></tr>'
      }</tbody></table></div>`;
  }

  function deploy(rows) {
    return head('deployment diff','record public / observatory releases so behavior can be correlated with a build.') +
      `<div class="card"><form id="deployForm" class="controls"><input id="dbuild" placeholder="build"><input id="dref" placeholder="git ref"><input id="dnote" placeholder="note"><button class="btn">record</button></form></div>
      <div class="section"><div class="section-title">history</div><div class="table-wrap"><table><thead><tr><th>time</th><th>build</th><th>ref</th><th>note</th></tr></thead><tbody>${
        (rows || []).length ? rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.build)}</td><td>${esc(x.ref)}</td><td>${esc(x.note)}</td></tr>`).join('') :
        '<tr><td colspan="4">no deployments recorded</td></tr>'
      }</tbody></table></div></div>`;
  }

  function privacy() {
    return head('privacy monitor','what the observatory can and cannot know.') +
      `<div class="grid">${metric('IP address','NEVER','not collected')}${metric('location','NEVER','not collected')}${metric('names','NEVER','not collected')}${metric('raw memory','NEVER','local only')}${metric('full URL','NEVER','not stored')}${metric('user agent','NEVER','not stored')}${metric('random session ID','YES','relationship only')}${metric('event metadata','BOUNDED','allowlisted')}</div>
      <div class="section"><div class="section-title">server-side fields</div><div class="card"><pre>session id · visitor pseudonym · timestamp · event type
track / album subject · selected feature metadata · build
no raw URLs, device details, or Category 5 profile</pre></div></div>`;
  }

  function system() {
    return head('system','deployment, ingestion, database and runtime health.') +
      `<div class="grid">${metric('worker','ONLINE','Cloudflare')}${metric('D1','ONLINE','stankquilizer-observatory')}${metric('auth','ONLINE','HttpOnly cookie')}${metric('frontend','CLEAN','single application')}</div>
      <div class="two section"><div><div class="section-title">security</div><div class="card"><pre>server-side password
HttpOnly + Secure + SameSite=Strict
no public DB endpoint
CSP + frame denial + nosniff</pre></div></div><div><div class="section-title">runtime</div><div class="card"><pre>API calls happen after login only
401 responses never force a page reload
logout clears the auth cookie without reload
mobile navigation is self-contained</pre></div></div></div>`;
  }

  async function loadPage(page) {
    $('moreSheet').classList.remove('open');
    clearTimeout(loadPage.refreshTimer);
    loadPage.currentPage = page;
    const requestId = loadPage.requestId = (loadPage.requestId || 0) + 1;
    const formState = page === 'deploy' ? {
      build: $('dbuild')?.value || '', ref: $('dref')?.value || '', note: $('dnote')?.value || ''
    } : null;
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
    location.hash = page;
    let html = '';
    if(page==='overview'){
      let d=null; try { d=await api('/overview'); } catch(e) {}
      html=overview(d);
    } else if(page==='live') {
      let d=null; try { d=await api('/live?minutes=60&limit=60'); } catch(e) {}
      html=live(d);
    }
    else if(page==='sessions') html=await sessions();
    else if(page==='memory') { let d=null; try { d=await api('/memory'); } catch(e) {} html=memory(d); }
    else if(page==='player') { let d=null; try { d=await api('/radio'); } catch(e) {} html=player(d); }
    else if(page==='radio') { let d=null; try { d=await api('/radio'); } catch(e) {} html=radio(d); }
    else if(page==='projects') { let d=null; try { d=await api('/projects'); } catch(e) {} html=projects(d); }
    else if(page==='rediscovery') { let d=null; try { d=await api('/rediscoveries'); } catch(e) {} html=rediscoveries(d); }
    else if(page==='journey') { let d=null; try { d=await api('/memory'); } catch(e) {} html=journey(d); }
    else if(page==='features') { let d=null; try { d=await api('/feature-counts'); } catch(e) {} html=features(d); }
    else if(page==='qa') { let d=[]; try { d=await api('/qa?limit=50'); } catch(e) {} html=qa(d); }
    else if(page==='events'){
      let d=[]; try { d=await api('/events?limit=100'); } catch(e) {}
      html=events(d);
    } else if(page==='deploy'){
      let d=[]; try { d=await api('/deployments'); } catch(e) {}
      html=deploy(d);
    } else if(page==='privacy') html=privacy();
    else html=system();
    if (requestId !== loadPage.requestId || loadPage.currentPage !== page) return;
    $('main').innerHTML=html;
    if (formState) {
      $('dbuild').value = formState.build;
      $('dref').value = formState.ref;
      $('dnote').value = formState.note;
    }
    wirePage(page);
    const status = $('refreshStatus');
    if (status) status.textContent = '● auto-refresh every 15s · checked ' + new Date().toLocaleTimeString();
    if (!['privacy','system'].includes(page)) {
      loadPage.refreshTimer = setTimeout(() => {
        if (loadPage.currentPage === page) loadPage(page);
      }, 15000);
    }
  }

  function wirePage(page) {
    if(page==='qa'){
      document.querySelectorAll('[data-qa]').forEach(btn=>btn.addEventListener('click',async()=>{
        try { await api('/qa',{method:'POST',body:JSON.stringify({scenario:btn.dataset.qa})}); toast('QA emitted: '+btn.dataset.qa); }
        catch(e){ toast('QA request failed'); }
      }));
    }
    if(page==='deploy'){
      $('deployForm').addEventListener('submit',async e=>{
        e.preventDefault();
        try{
          await api('/deployments',{method:'POST',body:JSON.stringify({
            build:$('dbuild').value,ref:$('dref').value,note:$('dnote').value
          })});
          toast('deployment recorded');
          $('dbuild').value = $('dref').value = $('dnote').value = '';
          await loadPage('deploy');
        }catch(e){toast('deployment request failed');}
      });
    }
  }

  function installNav() {
    $('desktopNav').innerHTML = NAV.map(p=>`<button data-page="${p}">${p.replaceAll('-',' ')}</button>`).join('');
    $('mobilebar').innerHTML = NAV.slice(0,4).map(p=>`<button data-page="${p}">${p}</button>`).join('') + '<button id="moreBtn">more</button>';
    $('moreNav').innerHTML = NAV.slice(4).map(p=>`<button data-page="${p}">${p}</button>`).join('') + '<button id="logoutBtn">logout</button>';
    document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>loadPage(btn.dataset.page)));
    $('moreBtn').addEventListener('click',()=>$('moreSheet').classList.add('open'));
    $('closeMore').addEventListener('click',()=>$('moreSheet').classList.remove('open'));
    $('logoutBtn').addEventListener('click',async()=>{
      try { await fetch('/api/logout',{credentials:'same-origin',cache:'no-store'}); } finally {
        $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('password').value=''; $('password').focus();
      }
    });
  }

  async function login(event) {
    event.preventDefault();
    const password = $('password').value;
    $('loginError').textContent = '';
    try {
      const response = await fetch('/api/login',{
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({password})
      });
      if(!response.ok){ $('loginError').textContent='access denied'; return; }
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      installNav();
      await loadPage(location.hash.slice(1) || 'overview');
    } catch(e) {
      $('loginError').textContent='connection error — try again';
    }
  }

  $('loginForm').addEventListener('submit',login);
  $('password').focus();
})();
</script>
</body>
</html>
