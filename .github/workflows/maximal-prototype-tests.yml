name: maximal prototype regression tests

on:
  push:
    branches:
      - archive/maximal-starter
    paths:
      - 'prototypes/maximal-starter/**'
      - '.github/workflows/maximal-prototype-tests.yml'
  pull_request:
    branches:
      - archive/maximal-starter
    paths:
      - 'prototypes/maximal-starter/**'

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test prototypes/maximal-starter/verify.test.mjs
